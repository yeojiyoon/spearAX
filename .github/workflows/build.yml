name: Build spearax

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 받기
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 시스템 패키지 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: 파이썬 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 실행파일 빌드
        run: |
          pyinstaller \
            --onefile \
            --name spearax \
            --collect-all pymavlink \
            --hidden-import cv2 \
            main_loop.py

      - name: 빌드 결과 업로드
        uses: actions/upload-artifact@v4
        with:
          name: spearax-linux
          path: dist/spearax
